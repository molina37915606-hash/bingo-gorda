name: Materializar V6 software gratuito

on:
  push:
    branches: [main]
    paths:
      - '.v6-deploy/**'
      - '.github/workflows/apply-v6.yml'
      - 'apply-v6-runtime.js'
      - 'package.json'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materializar y validar V6
        shell: bash
        run: |
          set -euo pipefail
          node apply-v6-runtime.js
          npm install
          npm test
          rm -rf .v6-deploy
          rm -f apply-v6-runtime.js
          rm -f .github/workflows/apply-v6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "V6: convertir plataforma a software gratuito"
          git push origin HEAD:main
