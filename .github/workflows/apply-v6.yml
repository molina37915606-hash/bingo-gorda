name: Materializar V6 software gratuito

on:
  push:
    branches: [main]
    paths:
      - '.v6-deploy/**'
      - '.github/workflows/apply-v6.yml'
      - 'apply-v6-runtime.js'
      - 'package.json'
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Materializar y validar V6
        shell: bash
        run: |
          set -euo pipefail
          if [ -f apply-v6-runtime.js ]; then
            node apply-v6-runtime.js
          fi
          rm -rf assets/tv-voice
          npm install
          npm test
          if [ ! -f apply-v6-runtime.js ]; then
            exit 0
          fi
          rm -rf .v6-deploy
          rm -f apply-v6-runtime.js
          rm -f .github/workflows/apply-v6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "V6: convertir plataforma a software gratuito"
          TARGET_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin "HEAD:${TARGET_BRANCH}"
