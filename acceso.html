<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BINGO DE LA GORDA - Final · Ingresar</title>
<style>
:root{--bg:#060914;--bg2:#0b1020;--panel:#111a2f;--panel2:#0a1022;--border:#35415c;--text:#f7f8ff;--muted:#b8c5df;--gold:#ffbf28;--gold2:#ffe06b;--danger:#ff7d8e}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#28234f 0,var(--bg) 43%,#02040a 100%);color:var(--text);font-family:Segoe UI,Arial,sans-serif}.wrap{width:min(920px,calc(100% - 28px));margin:auto;padding:18px 0 40px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:58px}.brand img{width:45px;height:45px;object-fit:contain}.brand h1{margin:0;font-size:19px}.brand small{color:#d0daf0}.card{background:#111a2ff2;border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:0 18px 60px #0008}.login{max-width:890px;margin:auto}.login h2{font-size:24px;margin:0 0 12px}.lead{color:var(--muted);line-height:1.5;margin:0 0 18px}.roomMeta{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}.chip{padding:8px 10px;border-radius:999px;background:#0a1022;border:1px solid #394765;color:#dfe7fa;font-size:12px;font-weight:800}.chip.gold{border-color:#d99a13;color:#ffe5a0}.field{display:grid;gap:7px;margin-top:14px}.field label,.field b{font-size:13px;color:#d5def3;font-weight:900}.field input,.field select{width:100%;border:2px solid var(--border);border-radius:13px;background:var(--panel2);color:var(--text);padding:15px 16px;font-size:19px;font-weight:900}.field input.code{text-align:center;letter-spacing:3px;text-transform:uppercase;font-size:25px}.btn{display:block;width:100%;border:0;border-radius:13px;padding:15px 16px;margin-top:14px;font-size:16px;font-weight:1000;cursor:pointer}.primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#251800}.secondary{background:#18233e;color:#fff;border:1px solid #445271}.error{margin:0 0 14px;padding:12px;border-radius:12px;background:#541723;border:1px solid #b83b50;color:#ffe1e6}.notice{margin:14px 0 0;padding:12px;border-radius:12px;background:#0d2c25;border:1px solid #286d59;color:#d9fff3;line-height:1.45}.price{font-size:17px;font-weight:1000;color:#ffe09a}.back{display:inline-block;margin-top:14px;color:#c7d6f3;text-decoration:none;font-weight:800}@media(max-width:600px){.wrap{width:min(100% - 20px,920px);padding-top:10px}.brand{margin-bottom:32px}.brand h1{font-size:16px}.card{padding:15px}.login h2{font-size:21px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><img src="/assets/logo.webp" alt="Logo"><div><h1>BINGO DE LA GORDA - Final</h1><small>Acceso a partidas</small></div></div>
  <section class="card login">
    <!--ACCESS_CONTENT-->
  </section>
</div>
</body>
</html>
