<!doctype html>
<html lang="es" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b15">
<title>Vista previa del jugador · BETA 4.3</title>
<style>
:root{--bg:#070914;--panel:#11182b;--panel2:#18223a;--panel3:#0c1120;--text:#f7f8fc;--muted:#aeb8cd;--line:#ffffff20;--gold:#ffca2f;--green:#29c381;--red:#ef5871;--purple:#8c45cf;--cell:#f4f4f7;--cellText:#131722;--marked:#ffda62;--blank:#282d3d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 40% 0,#271a46,var(--bg) 48%);color:var(--text);font-family:Segoe UI,Arial,sans-serif}body{padding:8px}.app{width:min(760px,100%);margin:auto;display:grid;gap:8px}.top{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:14px;background:#12172bde;position:sticky;top:0;z-index:5;backdrop-filter:blur(10px)}.top img{width:38px;height:38px;object-fit:contain}.top strong{display:block;font-size:13px}.top small{display:block;color:var(--muted);font-size:9px}.readonly{margin-left:auto;font-size:8px;font-weight:1000;padding:5px 7px;border-radius:999px;background:#123f33;color:#b8ffe5;border:1px solid #38cc8c66}.statusCard,.ticketCard,.chatCard{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:10px}.statusRow{display:grid;grid-template-columns:86px 1fr;gap:10px;align-items:center}.ball{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 28%,#fff,#e9d5ff 20%,#a350ef 48%,#4a1677 78%);font-size:34px;font-weight:1000;color:#1c082c;border:5px solid #ffffff28}.meta h2{margin:0;font-size:18px}.meta p{margin:4px 0 0;color:var(--muted);font-size:10px}.recent{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}.recent span{min-width:28px;height:28px;padding:0 6px;border-radius:999px;display:grid;place-items:center;background:var(--panel2);font-size:9px;font-weight:1000}.modeRow{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px}.mode{padding:7px;border:1px solid var(--line);border-radius:9px;text-align:center;font-size:9px;font-weight:1000;background:var(--panel3);color:var(--muted)}.mode.active{background:var(--gold);color:#211500;border-color:#ffe26e}.tabs{display:flex;gap:5px;overflow:auto;margin-bottom:7px}.tabs button{border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text);padding:6px 9px;font-size:9px;font-weight:900;white-space:nowrap}.tabs button.active{background:var(--purple)}.ticketHead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:7px}.ticketHead b{font-size:13px}.ticketHead small{color:var(--muted);font-size:9px}.grid{display:grid;gap:3px}.grid.m90{grid-template-columns:repeat(9,minmax(0,1fr))}.grid.m75{grid-template-columns:repeat(5,minmax(0,1fr))}.cell{aspect-ratio:1.05;border-radius:5px;background:var(--cell);color:var(--cellText);display:grid;place-items:center;font-weight:1000;font-size:clamp(11px,4vw,22px);position:relative}.m90 .cell{font-size:clamp(9px,3vw,18px)}.cell.blank{background:var(--blank);color:transparent}.cell.free{background:var(--purple);color:#fff;font-size:8px}.cell.marked{background:var(--marked);color:#251900;box-shadow:inset 0 0 0 2px #f6b800}.cell.marked:after{content:'✓';position:absolute;right:2px;top:1px;font-size:7px}.claimRule{text-align:center;font-size:9px;color:#ffe59b;font-weight:1000;margin:7px 0 5px}.claims{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.claim{padding:9px 4px;border-radius:9px;border:1px solid var(--line);background:#37234f;color:#fff;font-size:10px;font-weight:1000;text-align:center;opacity:.65}.claim.ready{opacity:1;background:linear-gradient(135deg,#ffb51e,#ffe36b);color:#261700;box-shadow:0 0 0 3px #ffd44938,0 0 22px #ffcf3b55}.chatTitle{font-size:10px;font-weight:1000;margin-bottom:6px}.chat{display:grid;gap:4px;max-height:140px;overflow:auto}.msg{padding:6px 7px;border-radius:8px;background:var(--panel2);font-size:9px;line-height:1.3}.msg b{color:var(--gold)}.empty{color:var(--muted);font-size:10px;text-align:center;padding:15px 5px}.error{border:1px solid #ef587166;background:#38141b;color:#ffd7dd;padding:10px;border-radius:12px;font-size:11px}.version{text-align:center;color:#758199;font-size:8px;padding:2px}
@media(max-width:430px){body{padding:5px}.statusCard,.ticketCard,.chatCard{padding:8px}.statusRow{grid-template-columns:76px 1fr}.ball{width:72px;height:72px;font-size:30px}.claims{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{gap:2px}.cell{border-radius:4px}.chat{max-height:105px}}

@media(orientation:landscape) and (max-height:650px) and (min-width:560px){body{padding:4px}.app{width:100%;grid-template-columns:minmax(150px,.48fr) minmax(390px,1.52fr);grid-template-areas:"top top" "status ticket" "chat ticket" "version version";gap:5px}.top{grid-area:top;padding:5px 8px}.statusCard{grid-area:status}.ticketCard{grid-area:ticket}.chatCard{grid-area:chat;min-height:0}.statusRow{grid-template-columns:64px 1fr}.ball{width:62px;height:62px;font-size:27px}.recent{max-height:55px;overflow:hidden}.ticketCard{padding:7px}.grid{gap:2px}.cell{aspect-ratio:auto;height:clamp(28px,8vh,39px);font-size:clamp(14px,2.3vw,20px)}.m90 .cell{font-size:clamp(12px,1.9vw,18px)}.claims{grid-template-columns:repeat(3,minmax(0,1fr))}.claim{padding:6px 3px;font-size:8px}.chat{max-height:120px}.version{grid-area:version}}

</style>
</head>
<body>
<main class="app">
  <header class="top"><img src="/assets/logo.png" alt=""><div><strong>LA GORDA - BINGO ONLINE</strong><small id="playerMeta">Vista de jugador</small></div><span class="readonly">SOLO VISTA</span></header>
  <section class="statusCard"><div class="statusRow"><div id="ball" class="ball">—</div><div class="meta"><h2 id="statusTitle">Cargando partida…</h2><p id="statusText"></p><div id="recent" class="recent"></div></div></div><div class="modeRow"><div id="manualMode" class="mode">MANUAL</div><div id="autoMode" class="mode">AUTOMARCADO</div></div></section>
  <section class="ticketCard"><div id="tabs" class="tabs"></div><div class="ticketHead"><b id="ticketName">Cartón</b><small id="ticketHint">Vista simulada</small></div><div id="ticket" class="grid"></div><div class="claimRule">⚡ Gana el primer reclamo válido</div><div id="claims" class="claims"></div></section>
  <section class="chatCard"><div class="chatTitle">CHAT DE LA SALA</div><div id="chat" class="chat"></div></section>
  <div class="version">BINGO DE LA GORDA BETA 4.3 · vista previa sin login</div>
</main>
<script src="/js/admin-player-preview.js?v=4.3.0"></script>
</body></html>
