<!doctype html>
<html lang="es" data-theme="night"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080915"><title>LA GORDA - BINGO ONLINE</title>
<style>
:root{--bg:#070914;--panel:#11182b;--panel2:#18213a;--text:#f7f8fc;--muted:#aeb8cd;--line:#ffffff22;--gold:#ffca2f;--red:#d9435e}html[data-theme=day]{--bg:#edf2f8;--panel:#fff;--panel2:#e9f0f8;--text:#111827;--muted:#536075;--line:#17203324}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#332263,var(--bg) 52%);color:var(--text);font-family:Segoe UI,Arial,sans-serif}button,input{font:inherit}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 18px 50px #0007}.login{width:min(450px,92vw);margin:8vh auto}.logo{width:min(310px,78%);display:block;margin:auto}.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:1000;cursor:pointer}.primary{background:linear-gradient(135deg,#ffb51e,#ffe36b);color:#241600}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.danger{background:#8b2638;color:#fff}.wrap{width:min(900px,94vw);margin:auto;padding:20px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.menu{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:18px}.action{text-align:left;min-height:180px;border:1px solid #a477e555;border-radius:20px;background:linear-gradient(145deg,#33165d,#131b35);color:#fff;padding:23px;cursor:pointer}.action strong{display:block;color:var(--gold);font-size:27px;margin-bottom:8px}.action span{color:#d4daea;line-height:1.5}.field{display:grid;gap:7px;margin-top:13px;font-weight:900}.field input{padding:14px;border-radius:11px;border:1px solid var(--line);background:#070b17;color:#fff}.error{margin-top:10px;padding:11px;border-radius:10px;background:#5b1926}.demo{display:block;text-align:center;margin-top:10px;color:var(--text)}@media(max-width:650px){.menu{grid-template-columns:1fr}.head{align-items:flex-start}}
</style></head><body>
<section id="login" class="login card"><img class="logo" src="assets/logo.png" alt="LA GORDA - BINGO ONLINE"><h2>Panel del administrador</h2><label class="field">Contraseña<input id="password" type="password" autocomplete="current-password"></label><button id="loginBtn" class="btn primary" style="width:100%;margin-top:13px">INGRESAR</button><a class="demo" href="/demo">Probar demostración para jugadores</a><div id="error"></div></section>
<main id="app" class="wrap" hidden><div class="head"><div><h1 style="margin:0">LA GORDA - BINGO ONLINE</h1><div style="color:var(--muted)">Administración principal</div></div><button id="logoutBtn" class="btn danger">SALIR</button></div><section class="menu"><button id="newBtn" class="action"><strong>CREAR SALA</strong><span>Configurá modalidad, cartones, voz, espera y transmisión en una sola pantalla.</span></button><button id="recoverBtn" class="action"><strong>CONTINUAR</strong><span>Recuperá una sala abierta o una partida en curso.</span></button></section></main>
<script>
const $=id=>document.getElementById(id);let token=sessionStorage.getItem('bingoMasterToken')||'';
async function req(url,opt={},auth=true){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(auth&&token?{'X-Master-Token':token}:{}),...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No se pudo completar la acción.');return d}
async function openAdmin(action=''){try{let adminToken=sessionStorage.getItem('bingoOnlineAdminToken:owner')||'';if(!adminToken){const d=await req('/api/master/admin-session',{method:'POST',body:'{}'});adminToken=d.adminToken;sessionStorage.setItem('bingoOnlineAdminToken:owner',adminToken)}const url=new URL('/admin',location.origin);if(action)url.searchParams.set('accion',action);location.href=url}catch(e){$('error').innerHTML=`<div class="error">${e.message}</div>`}}
async function login(){try{$('loginBtn').disabled=true;const d=await req('/api/master/login',{method:'POST',body:JSON.stringify({password:$('password').value})},false);token=d.token;sessionStorage.setItem('bingoMasterToken',token);sessionStorage.setItem('bingoOnlineAdminToken:owner',d.adminToken);$('login').hidden=true;$('app').hidden=false}catch(e){$('error').innerHTML=`<div class="error">${e.message}</div>`}finally{$('loginBtn').disabled=false}}
$('loginBtn').onclick=login;$('password').onkeydown=e=>e.key==='Enter'&&login();$('newBtn').onclick=()=>openAdmin('nuevo');$('recoverBtn').onclick=()=>openAdmin('recuperar');$('logoutBtn').onclick=async()=>{try{await req('/api/master/logout',{method:'POST',body:'{}'})}catch{}sessionStorage.clear();location.reload()};if(token){$('login').hidden=true;$('app').hidden=false}
</script></body></html>
