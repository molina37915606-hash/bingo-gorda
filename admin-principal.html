<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BINGO GORDA 2026 · Panel principal</title><style>:root{--bg:#050817;--panel:#10172c;--line:#344573;--text:#fff;--muted:#aab5d1;--yellow:#ffd33d;--purple:#8538e7;--red:#d44358}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#29175a,#070b19 52%,#03050d);color:var(--text);font-family:Segoe UI,Arial,sans-serif}button,input{font:inherit}.card{background:linear-gradient(180deg,#141d38,#0a1021);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 18px 50px #0007}.login{width:min(460px,92vw);margin:10vh auto}.logo{max-width:330px;width:78%;display:block;margin:0 auto 15px}label{display:grid;gap:7px;font-weight:900}input{width:100%;padding:13px;border-radius:11px;border:1px solid #496092;background:#070c19;color:#fff}.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:1000;cursor:pointer}.primary{background:linear-gradient(#ffe063,#f2ab00);color:#221700}.secondary{background:#26375d;color:#fff}.danger{background:#8d2638;color:#fff}.wrap{width:min(980px,94vw);margin:auto;padding:24px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.muted{color:var(--muted)}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.action{min-height:190px;text-align:left;background:linear-gradient(145deg,#31175a,#111a35);color:#fff;border:1px solid #8b5fd4;border-radius:20px;padding:22px;cursor:pointer}.action strong{display:block;font-size:25px;color:var(--yellow);margin-bottom:10px}.action span{color:#d2d8e9;line-height:1.5}.demoLink{display:block;text-align:center;margin-top:10px;padding:13px;border-radius:12px;border:1px solid #8b5fd4;background:#21173d;color:#fff;text-decoration:none;font-weight:1000}.notice,.error{padding:11px;border-radius:10px;margin-top:10px}.notice{background:#123653}.error{background:#5a1624}@media(max-width:650px){.menu{grid-template-columns:1fr}.head{align-items:flex-start}.wrap{padding:12px}}</style></head><body><section id="login" class="login card"><img class="logo" src="assets/logo.png"><h2>PANEL DEL PROPIETARIO</h2><p class="muted">Ingresá con la clave configurada en Render.</p><label>Contraseña principal<input id="password" type="password" autocomplete="current-password"></label><button id="loginBtn" class="btn primary" style="width:100%;margin-top:12px">INGRESAR</button><a class="demoLink" href="/demo">PROBAR UNA DEMOSTRACIÓN</a><div id="loginError"></div></section><main id="app" class="wrap" hidden><div class="head"><div><h1 style="margin:0">BINGO GORDA 2026.4</h1><div class="muted">Administración principal</div></div><button id="logoutBtn" class="btn danger">SALIR</button></div><section class="menu"><button id="newBtn" class="action"><strong>CREAR SALA</strong><span>Prepará un juego nuevo, generá los cartones y configurá la sala.</span></button><button id="recoverBtn" class="action"><strong>RECUPERAR PARTIDA</strong><span>Abrí el administrador para continuar un juego guardado o una sala activa.</span></button><button id="manageBtn" class="action"><strong>ADMINISTRAR MI BINGO</strong><span>Entrá al panel completo, controles del sorteo, jugadores y modo TikTok.</span></button></section></main><script>const $=id=>document.getElementById(id);let token=sessionStorage.getItem('bingoMasterToken')||'';async function req(url,opt={},auth=true){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(auth&&token?{'X-Master-Token':token}:{}),...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No se pudo completar la acción.');return d}async function openAdmin(action=''){try{let adminToken=sessionStorage.getItem('bingoOnlineAdminToken:owner')||'';if(!adminToken){const d=await req('/api/master/admin-session',{method:'POST',body:'{}'});adminToken=d.adminToken;sessionStorage.setItem('bingoOnlineAdminToken:owner',adminToken)}const url=new URL('/admin',location.origin);if(action)url.searchParams.set('accion',action);window.location.href=url}catch(e){$('loginError').innerHTML=`<div class="error">${e.message}</div>`}}async function login(){try{$('loginBtn').disabled=true;const d=await req('/api/master/login',{method:'POST',body:JSON.stringify({password:$('password').value})},false);token=d.token;sessionStorage.setItem('bingoMasterToken',token);if(d.adminToken)sessionStorage.setItem('bingoOnlineAdminToken:owner',d.adminToken);$('login').hidden=true;$('app').hidden=false}catch(e){$('loginError').innerHTML=`<div class="error">${e.message}</div>`}finally{$('loginBtn').disabled=false}}$('loginBtn').onclick=login;$('password').onkeydown=e=>e.key==='Enter'&&login();$('newBtn').onclick=()=>openAdmin('nuevo');$('recoverBtn').onclick=()=>openAdmin('recuperar');$('manageBtn').onclick=()=>openAdmin();$('logoutBtn').onclick=async()=>{try{await req('/api/master/logout',{method:'POST',body:'{}'})}catch{}sessionStorage.removeItem('bingoMasterToken');sessionStorage.removeItem('bingoOnlineAdminToken:owner');location.reload()};if(token){$('login').hidden=true;$('app').hidden=false}</script></body></html>
