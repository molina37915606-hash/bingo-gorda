<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bingo de la Gorda 2.1 · Administración principal</title>
<style>
:root{--bg:#050817;--panel:#10172c;--line:#344573;--text:#fff;--muted:#aab5d1;--yellow:#ffd33d;--pink:#ed4fa3;--purple:#8538e7;--green:#21b66b;--red:#d44358}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#29175a,#070b19 52%,#03050d);color:var(--text);font-family:Segoe UI,Arial,sans-serif}button,input,select{font:inherit}.wrap{width:min(1180px,94vw);margin:auto;padding:24px}.card{background:linear-gradient(180deg,#141d38,#0a1021);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 18px 50px #0007}.login{width:min(460px,92vw);margin:12vh auto}.logo{max-width:340px;width:80%;display:block;margin:0 auto 15px}.grid{display:grid;grid-template-columns:360px 1fr;gap:16px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.head h1{margin:0;font-size:25px}.muted{color:var(--muted)}label{display:grid;gap:6px;margin:10px 0;font-weight:800}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #496092;background:#070c19;color:#fff}.btn{border:0;border-radius:11px;padding:12px 15px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(#ffe063,#f2ab00);color:#221700}.secondary{background:#26375d;color:#fff}.danger{background:#8d2638;color:#fff}.good{background:#126844;color:#fff}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.operators{display:grid;gap:11px}.operator{border:1px solid #ffffff22;border-radius:14px;padding:14px;background:#0a1020}.operatorHead{display:flex;justify-content:space-between;gap:12px;align-items:start}.status{font-weight:900;border-radius:999px;padding:5px 9px;font-size:12px}.active{background:#135e41;color:#caffea}.expired{background:#625019;color:#ffe8a0}.revoked{background:#701d31;color:#ffd8df}.url{font:700 12px Consolas,monospace;background:#050914;border-radius:9px;padding:9px;word-break:break-all;margin:9px 0}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;color:var(--muted);font-size:12px}.error{background:#5a1624;border:1px solid #c34860;padding:11px;border-radius:10px;margin-top:10px}.notice{background:#123653;border:1px solid #2c79ad;padding:11px;border-radius:10px;margin-top:10px}@media(max-width:850px){.grid{grid-template-columns:1fr}.meta{grid-template-columns:1fr 1fr}.wrap{padding:12px}}
</style>
</head>
<body>
<section id="login" class="login card"><img class="logo" src="assets/logo.png"><h2>ADMINISTRACIÓN PRINCIPAL</h2><p class="muted">Este acceso es únicamente para el propietario de la plataforma.</p><label>Contraseña principal<input id="password" type="password" autocomplete="current-password"></label><button id="loginBtn" class="btn primary" style="width:100%">INGRESAR</button><div id="loginError"></div></section>
<main id="app" class="wrap" hidden>
<div class="head"><div><h1>BINGO DE LA GORDA 2.1</h1><div class="muted">Panel principal · accesos temporales</div></div><div class="toolbar"><button id="ownerBtn" class="btn primary">ADMINISTRAR MI BINGO</button><button id="refreshBtn" class="btn secondary">ACTUALIZAR</button><button id="logoutBtn" class="btn danger">SALIR</button></div></div>
<div class="grid">
<section class="card"><h2>Crear acceso temporal</h2><p class="muted">El operador recibe otro enlace y nunca accede a este panel.</p><label>Nombre del operador<input id="name" maxlength="80" placeholder="Ej.: Juan · Bingo del Club"></label><label>Duración<select id="hours"><option value="6">6 horas</option><option value="12">12 horas</option><option value="24" selected>24 horas</option><option value="48">48 horas</option><option value="72">72 horas</option><option value="168">7 días</option></select></label><label>Límite de partidas<input id="maxGames" type="number" min="0" max="999" value="0"><small class="muted">0 significa sin límite durante el período.</small></label><button id="createBtn" class="btn primary" style="width:100%">CREAR ACCESO</button><div id="createResult"></div></section>
<section class="card"><div class="head"><div><h2 style="margin:0">Administradores temporales</h2><div class="muted" id="count"></div></div></div><div id="operators" class="operators"></div></section>
</div></main>
<script>
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token=sessionStorage.getItem('bingoMasterToken')||'';
async function req(url,opt={},auth=true){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(auth&&token?{'X-Master-Token':token}:{}),...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No se pudo completar la acción.');return d}
function fmt(v){return v?new Date(v).toLocaleString('es-AR'):'—'}
function showApp(){ $('login').hidden=true;$('app').hidden=false }
async function login(){try{$('loginBtn').disabled=true;const d=await req('/api/master/login',{method:'POST',body:JSON.stringify({password:$('password').value})},false);token=d.token;sessionStorage.setItem('bingoMasterToken',token);showApp();await load()}catch(e){$('loginError').innerHTML=`<div class="error">${esc(e.message)}</div>`}finally{$('loginBtn').disabled=false}}
async function load(){try{const d=await req('/api/master/state');render(d)}catch(e){token='';sessionStorage.removeItem('bingoMasterToken');$('app').hidden=true;$('login').hidden=false;$('loginError').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
function render(d){$('ownerBtn').onclick=()=>window.open(d.ownerUrl||'/admin','_blank');$('count').textContent=`${d.operators.length} acceso(s) creados`;$('operators').innerHTML=d.operators.length?d.operators.map(o=>`<article class="operator"><div class="operatorHead"><div><b>${esc(o.name)}</b><div class="muted">Vence: ${esc(fmt(o.expiresAt))}</div></div><span class="status ${esc(o.status)}">${esc(o.status.toUpperCase())}</span></div><div class="url">${esc(o.accessUrl)}</div><div class="meta"><span>Partidas: ${o.gamesCreated}${o.maxGames?` / ${o.maxGames}`:' / sin límite'}</span><span>Sala: ${esc(o.roomCode||'—')} · ${esc(o.roomStatus)}</span><span>Último acceso: ${esc(fmt(o.lastLoginAt))}</span></div><div class="toolbar" style="margin-top:10px"><button class="btn good" data-copy="${esc(o.accessUrl)}">COPIAR ENLACE</button><button class="btn secondary" data-extend="${esc(o.id)}">+24 HORAS</button><button class="btn secondary" data-regenerate="${esc(o.id)}">NUEVO ENLACE</button><button class="btn ${o.status==='revoked'?'good':'danger'}" data-revoke="${esc(o.id)}" data-value="${o.status==='revoked'?'false':'true'}">${o.status==='revoked'?'REACTIVAR':'REVOCAR'}</button></div></article>`).join(''):'<div class="notice">Todavía no creaste accesos temporales.</div>';
document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);b.textContent='COPIADO'}catch{prompt('Copiá el enlace:',b.dataset.copy)}});document.querySelectorAll('[data-extend]').forEach(b=>b.onclick=()=>action('/api/master/operators/extend',{id:b.dataset.extend,hours:24}));document.querySelectorAll('[data-regenerate]').forEach(b=>b.onclick=()=>confirm('El enlace anterior dejará de servir. ¿Continuar?')&&action('/api/master/operators/regenerate',{id:b.dataset.regenerate}));document.querySelectorAll('[data-revoke]').forEach(b=>b.onclick=()=>action('/api/master/operators/revoke',{id:b.dataset.revoke,revoke:b.dataset.value==='true'}));}
async function action(url,body){try{const d=await req(url,{method:'POST',body:JSON.stringify(body)});render(d)}catch(e){alert(e.message)}}
$('createBtn').onclick=async()=>{try{const d=await req('/api/master/operators',{method:'POST',body:JSON.stringify({name:$('name').value,hours:Number($('hours').value),maxGames:Number($('maxGames').value)})});$('createResult').innerHTML=`<div class="notice"><b>Acceso creado</b><div class="url">${esc(d.operator.accessUrl)}</div><button id="copyNew" class="btn good">COPIAR ENLACE</button></div>`;$('copyNew').onclick=()=>navigator.clipboard.writeText(d.operator.accessUrl);$('name').value='';render(d.state)}catch(e){$('createResult').innerHTML=`<div class="error">${esc(e.message)}</div>`}};
$('loginBtn').onclick=login;$('password').onkeydown=e=>e.key==='Enter'&&login();$('refreshBtn').onclick=load;$('logoutBtn').onclick=async()=>{try{await req('/api/master/logout',{method:'POST',body:'{}'})}catch{}sessionStorage.removeItem('bingoMasterToken');location.reload()};
if(token){showApp();load()}
</script>
</body></html>
