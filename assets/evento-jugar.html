<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi cartón · Evento</title><style>:root{--bg:#09060d;--line:#ffffff22;--gold:#f1c95e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#35123c,transparent 35%),var(--bg);color:#fff;font-family:system-ui,Segoe UI,sans-serif}.wrap{width:min(720px,94vw);margin:auto;padding:14px 0 40px}.top{text-align:center;margin-bottom:12px}.top img{width:70px;height:70px;object-fit:contain}.top h1{margin:4px 0;font-size:22px}.top b{color:var(--gold)}.tabs{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:10px 0}.tabs button,.action{border:1px solid var(--line);background:#25152d;color:#fff;border-radius:10px;padding:10px 13px;font-weight:900;cursor:pointer}.tabs button.active{background:#821976;border-color:#df70d0}.card{background:#f7f1df;color:#111;border:3px solid #c2972f;border-radius:15px;padding:12px;box-shadow:0 14px 35px #0006}.head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.no{font-size:42px;font-weight:1000}.owner{font-size:17px;font-weight:900}.grid{display:grid;gap:4px}.cell{aspect-ratio:1.25;border:1px solid #6d5d42;border-radius:5px;display:grid;place-items:center;background:#fff;font-weight:1000;font-size:clamp(19px,5vw,32px);cursor:pointer;user-select:none}.cell.blank{background:#d8d3c8;color:transparent;cursor:default}.cell.mark{background:#f0c94e;box-shadow:inset 0 0 0 3px #9d7010}.help{text-align:center;color:#c9bacd;font-size:13px;margin:10px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}.action{display:inline-block;text-decoration:none}.tx{background:#6e5516;border-color:#b79538}.back{background:#153f31}.empty{margin:20vh auto;text-align:center;color:#ddd} @media print{body{background:white}.top img,.tabs,.actions,.help{display:none}.wrap{width:100%;padding:0}.card{box-shadow:none}}</style></head><body><main id="app" class="wrap"><div class="empty">Abriendo tus cartones…</div></main><script>(()=>{'use strict';const app=document.getElementById('app');function dec(t){const b=t.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-t.length%4)%4),bin=atob(b),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes))}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}let d;try{d=dec(location.hash.slice(1))}catch{app.innerHTML='<div class="empty"><h2>Enlace inválido</h2><p>Pedile nuevamente el enlace al organizador.</p></div>';return}if(!d?.cards?.length){app.innerHTML='<div class="empty">Este enlace no tiene cartones.</div>';return}let index=0;const marks={};function render(){const c=d.cards[index],n=Number(c.globalNumber)||index+1,key=String(n),cols=Number(c.mode)===75?5:9;marks[key]||=new Set;app.innerHTML=`<header class="top"><img src="/assets/logo.webp" alt="La Gorda"><h1>${esc(d.title||'EVENTO')}</h1><div><b>${esc(d.name||'PARTICIPANTE')}</b></div></header><div class="tabs">${d.cards.map((x,i)=>`<button data-i="${i}" class="${i===index?'active':''}">CARTÓN ${String(Number(x.globalNumber)||i+1).padStart(3,'0')}</button>`).join('')}</div><section class="card"><div class="head"><div><div class="owner">${esc(d.name||'')}</div><small>${esc(d.title||'')}</small></div><div style="text-align:right"><small>CARTÓN Nº</small><div class="no">${String(n).padStart(3,'0')}</div></div></div><div class="grid" style="grid-template-columns:repeat(${cols},1fr)">${(c.grid||[]).flat().map(v=>Number.isFinite(v)?`<div class="cell ${marks[key].has(v)?'mark':''}" data-n="${v}">${v}</div>`:'<div class="cell blank">.</div>').join('')}</div></section><div class="help">Tocá los números para marcarlos. No necesitás reclamar desde esta pantalla.</div><div class="actions">${d.broadcastUrl?`<a class="action tx" target="_blank" rel="noopener" href="${esc(d.broadcastUrl)}">VER TRANSMISIÓN</a>`:''}<button class="action" id="print">IMPRIMIR</button><a class="action back" href="/comunidad?quedar=1">COMUNIDAD</a></div>`;app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{index=Number(b.dataset.i);render()});app.querySelectorAll('[data-n]').forEach(el=>el.onclick=()=>{const v=Number(el.dataset.n);if(marks[key].has(v))marks[key].delete(v);else marks[key].add(v);el.classList.toggle('mark',marks[key].has(v))});document.getElementById('print').onclick=()=>print()}render()})();</script></body></html>
