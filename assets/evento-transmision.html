<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#08050e">
<title>Evento · Transmisión LAB</title>
<style>
:root{--bg:#08050e;--panel:#120b18;--panel2:#1a1021;--line:#ffffff20;--text:#fff8e9;--muted:#b9aebe;--gold:#f2c95d;--vio:#8d247f;--green:#55dc99}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}body{background:radial-gradient(circle at 15% 31%,#63206455,transparent 31%),linear-gradient(145deg,#16091c,#060409 72%)}.hidden{display:none!important}
.app{width:100vw;height:100vh;padding:9px;display:grid;grid-template-columns:29% 71%;grid-template-rows:17% 36% 8% 34%;grid-template-areas:'logo marquee' 'ball board' 'recent board' 'sponsors bottom';gap:1%;overflow:hidden}
.panel{min-width:0;min-height:0;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#160d1d,#0b0710);overflow:hidden}
.logoPanel{grid-area:logo;display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 14px}.logoPanel img{height:88%;max-width:56%;object-fit:contain;background:transparent;filter:drop-shadow(0 6px 13px #0007)}.logoText{min-width:0}.logoText b{display:block;font-size:clamp(13px,1.35vw,24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.logoText small{display:block;margin-top:5px;color:var(--muted);font-size:clamp(8px,.72vw,12px)}
.marquee{grid-area:marquee;position:relative;display:flex;align-items:center;padding:10px 80px 10px 18px;background:linear-gradient(180deg,#17101c,#0d0911);border-color:#f2c95d40}.marqueeViewport{width:100%;overflow:hidden}.marqueeText{display:block;width:max-content;min-width:100%;text-align:center;color:#ffe58e;font-size:clamp(18px,2.15vw,40px);font-weight:1000;letter-spacing:.025em;white-space:nowrap}.marqueeText.scroll{animation:marqueeMove 16s linear infinite}.live{position:absolute;right:13px;top:10px;text-align:right}.live strong{display:block;color:var(--green);font-size:clamp(9px,.8vw,13px)}.live span{display:block;margin-top:4px;color:var(--muted);font-size:clamp(7px,.62vw,10px)}
.ballPanel{grid-area:ball;display:grid;grid-template-rows:auto minmax(0,1fr) auto;place-items:center;gap:4px;padding:9px}.sectionLabel{font-size:clamp(9px,.8vw,13px);font-weight:1000;letter-spacing:.11em;color:#e1d5e4}.ball{width:min(61%,220px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;align-content:center;background:radial-gradient(circle at 31% 25%,#fff9db 0 6%,#c257b4 17%,#822274 54%,#2a0a31 100%);border:5px solid var(--gold);box-shadow:0 12px 34px #0008,0 0 30px #a4379635;font-size:clamp(54px,7vw,118px);font-weight:1000;line-height:.86;text-shadow:0 5px 14px #0008}.ball small{font-size:clamp(15px,1.5vw,25px);letter-spacing:.12em}.count{font-size:clamp(9px,.82vw,13px);font-weight:900;color:#d6cad9}
.recentPanel{grid-area:recent;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;background:transparent;border:0}.recentBall{min-width:0;min-height:0;display:grid;place-items:center;border:1px solid #c467bb;border-radius:8px;background:#711d69;font-size:clamp(13px,1.3vw,23px);font-weight:1000}.recentBall.empty{background:#17101c;border-color:#ffffff18;color:#63596a}
.sponsorPanel{grid-area:sponsors;display:grid;grid-template-rows:auto minmax(0,1fr) auto;place-items:center;gap:5px;padding:9px}.sponsorTitle{font-size:clamp(9px,.8vw,13px);font-weight:1000;letter-spacing:.1em;color:var(--gold)}.sponsorPanel img{width:96%;height:100%;min-height:0;object-fit:contain;background:transparent}.sponsorName{max-width:95%;font-size:clamp(8px,.75vw,12px);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sponsorEmpty{color:#776c7d;font-size:clamp(10px,.9vw,15px);font-weight:900}.dots{display:flex;gap:4px}.dots i{width:5px;height:5px;border-radius:50%;background:#ffffff2e}.dots i.on{width:15px;border-radius:8px;background:var(--gold)}
.boardPanel{grid-area:board;padding:8px}.board{width:100%;height:100%;display:grid;gap:4px;grid-auto-rows:minmax(0,1fr)}.board.m90{grid-template-columns:repeat(18,minmax(0,1fr))}.board.m75{grid-template-columns:repeat(15,minmax(0,1fr))}.num{min-width:0;min-height:0;display:grid;place-items:center;border:1px solid #ffffff18;border-radius:7px;background:#19101f;color:#dbd1df;font-size:clamp(10px,1vw,18px);font-weight:1000}.num.hit{background:linear-gradient(145deg,#9d328e,#66165f);border-color:#df82d4;color:#fff}.num.last{background:linear-gradient(145deg,#ffe99b,#e7bb3d);border-color:#fff0a6;color:#281900;box-shadow:0 0 18px #f2c95d45}
.bottomRight{grid-area:bottom;min-height:0;display:grid;grid-template-columns:35% minmax(0,1fr);gap:1%}.pot{display:grid;grid-template-rows:auto minmax(0,1fr) auto;place-items:center;padding:10px}.pot h2{margin:0;font-size:clamp(15px,1.7vw,30px);color:#f6db80}.potValue{font-size:clamp(29px,4vw,68px);font-weight:1000;line-height:1}.pot small{color:var(--muted);font-size:clamp(8px,.7vw,11px);font-weight:900}
.closest{min-height:0;display:grid;grid-template-rows:28px minmax(0,1fr);gap:5px;padding:7px}.closestHead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 3px}.closestHead strong{font-size:clamp(9px,.8vw,13px);letter-spacing:.05em}.closestHead span{color:var(--gold);font-size:clamp(8px,.72vw,11px);font-weight:1000}.cards{min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:5px}.card{min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:2px;padding:5px;border:1px solid #ffffff18;border-radius:9px;background:#17101e;overflow:hidden}.card.leader{border-color:#f2c95d80;background:#211429}.cardHead{min-width:0;display:flex;justify-content:space-between;gap:4px}.cardHead b{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(7px,.62vw,10px)}.cardHead span{white-space:nowrap;color:var(--muted);font-size:clamp(6px,.52vw,9px)}.mini{min-height:0;display:grid;gap:1px}.mini.m90{grid-template-columns:repeat(9,1fr)}.mini.m75{grid-template-columns:repeat(5,1fr)}.mini i{min-width:0;min-height:0;display:grid;place-items:center;background:#f4eff5;color:#25162a;font-style:normal;font-size:clamp(5px,.44vw,8px);font-weight:1000}.mini i.blank{background:#27182e;color:transparent}.mini i.hit{background:#f1ca55;color:#251600}.missing{font-size:clamp(6px,.52vw,9px);font-weight:1000;color:#f2d77d}.emptyCard{display:grid;place-items:center;color:#665d6b}
.scene{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:#07040df5;padding:24px}.scene.show{display:grid}.sceneBox{text-align:center;max-width:1000px}.sceneLogo{width:min(180px,20vw);max-height:180px;object-fit:contain;background:transparent}.scene small{display:block;color:var(--gold);font-size:clamp(14px,1.4vw,22px);font-weight:1000;letter-spacing:.15em}.scene h1{margin:10px 0 6px;font-size:clamp(54px,8vw,138px);line-height:.9}.scene p{margin:0;color:#d8cfdd;font-size:clamp(16px,2vw,32px);font-weight:850}.error{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:#ff9aa9;font-size:20px;font-weight:850}
@keyframes marqueeMove{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
@media(max-width:1100px){.app{padding:6px;gap:6px;grid-template-columns:30% 70%}.marquee{padding-right:64px}.ball{width:min(64%,190px)}.board{gap:2px}.num{border-radius:4px}.cards{gap:3px}.card{padding:3px}}
</style>
</head>
<body>
<main id="app" class="app hidden">
  <section class="logoPanel panel"><img id="logo" src="/assets/logo.webp" alt="Logo"><div class="logoText"><b id="eventTitle">EVENTO</b><small id="eventMeta">Bingo 90</small></div></section>
  <section class="marquee panel"><div class="marqueeViewport"><span id="marqueeText" class="marqueeText">EVENTO EN VIVO</span></div><div class="live"><strong id="status">● EN VIVO</strong><span id="sync">CONECTANDO…</span></div></section>
  <section class="ballPanel panel"><div class="sectionLabel">ÚLTIMA BOLILLA</div><div id="ball" class="ball">—</div><div id="count" class="count">Bolilla 0 de 90</div></section>
  <section id="recent" class="recentPanel"></section>
  <section id="sponsors" class="sponsorPanel panel"><div class="sponsorTitle">SPONSORS</div><div class="sponsorEmpty">ESPACIO PARA SPONSORS</div></section>
  <section class="boardPanel panel"><div id="board" class="board m90"></div></section>
  <section class="bottomRight"><div class="pot panel"><h2>POZO BINGO</h2><div id="potValue" class="potValue">BINGO</div><small id="potMeta">AHORA: LÍNEA</small></div><div class="closest panel"><div class="closestHead"><strong>CARTONES CERCA DE GANAR</strong><span id="target">LÍNEA</span></div><div id="cards" class="cards"></div></div></section>
</main>
<section id="scene" class="scene"><div class="sceneBox"><img id="sceneLogo" class="sceneLogo hidden" alt=""><small id="sceneKicker">EVENTO</small><h1 id="sceneTitle">PAUSA</h1><p id="sceneText"></p></div></section>
<div id="error" class="error hidden"></div>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
const DB_NAME='lgEventoLab',DB_STORE='kv',SPONSOR_KEY='sponsors',TOP_TEXT_KEY='evento_lab_top_text';
let payload={},state=null,lot=null,cards=[],assignments={},sponsorList=[],sponsorIndex=0,sponsorTimer=null,sponsorSig='',lastStateAt=0;
function decodePayload(raw){const text=String(raw||'').replace(/-/g,'+').replace(/_/g,'/'),bin=atob(text+'='.repeat((4-text.length%4)%4)),bytes=Uint8Array.from(bin,ch=>ch.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes))}
try{payload=decodePayload(location.hash.slice(1))}catch{payload={}}
function openDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(DB_STORE))req.result.createObjectStore(DB_STORE,{keyPath:'key'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function dbGet(key){try{const db=await openDb();return await new Promise((resolve,reject)=>{const req=db.transaction(DB_STORE,'readonly').objectStore(DB_STORE).get(key);req.onsuccess=()=>resolve(req.result?.value);req.onerror=()=>reject(req.error)})}catch{return null}}
function flattenLot(data){return(data?.series||[]).flatMap(series=>(series.cards||[]).map(card=>({...card,globalNumber:Number(card.globalNumber)||0,mode:Number(card.mode)||Number(data.mode)||90}))).sort((a,b)=>a.globalNumber-b.globalNumber)}
async function loadLot(){if(!payload.lotCode)return;try{const response=await fetch(`/api/community/cards/lot?lot=${encodeURIComponent(payload.lotCode)}`,{cache:'no-store'}),data=await response.json();if(response.ok){lot=data;cards=flattenLot(data)}}catch{}}
function refreshAssignments(){assignments=payload.assignments&&typeof payload.assignments==='object'?payload.assignments:{};if(!payload.lotCode)return;try{const local=JSON.parse(localStorage.getItem(`evento_lab_assignments:${payload.lotCode}`)||'{}');if(local&&Object.keys(local).length)assignments=local}catch{}}
function cardNumbers(card){return(card?.grid||[]).flat().filter(Number.isFinite)}
function lineMissing(card,set){const rows=(card?.grid||[]).map(row=>row.filter(Number.isFinite));return rows.length?Math.min(...rows.map(row=>row.filter(n=>!set.has(n)).length)):999}
function bingoMissing(card,set){return cardNumbers(card).filter(n=>!set.has(n)).length}
function ownerOf(card){return assignments[String(Number(card.globalNumber))]?.name||''}
function nearest(drawn){
  const set=new Set((drawn||[]).map(Number)),assigned=cards.filter(card=>ownerOf(card));
  if(assigned.length){const lineDone=assigned.some(card=>lineMissing(card,set)===0),target=lineDone?'BINGO':'LÍNEA',ranked=assigned.map(card=>{const line=lineMissing(card,set),bingo=bingoMissing(card,set);return{card,name:ownerOf(card),line,bingo,score:lineDone?bingo:line}}).sort((a,b)=>a.score-b.score||a.bingo-b.bingo||Number(a.card.globalNumber)-Number(b.card.globalNumber)).slice(0,6);return{target,ranked,set}}
  const fallback=(state?.highlightedCards||[]).slice(0,6).map(item=>({card:{globalNumber:item.cardNumber,grid:item.grid,mode:item.mode},name:item.playerName||'Jugador',score:Number(item.raceMissing)||0}));
  const target=String(fallback[0]?.racePrizeLabel||'PREMIO').toUpperCase();return{target,ranked:fallback,set};
}
function bingoLetter(number){return'BINGO'[Math.min(4,Math.floor((Number(number)-1)/15))]}
function ballMarkup(number,mode){if(number==null)return'—';return Number(mode)===75?`<small>${bingoLetter(number)}</small>${Number(number)}`:String(Number(number))}
function renderBoard(s){const mode=Number(s.game?.mode)===75?75:90,total=mode===75?75:90,set=new Set((s.game?.drawn||[]).map(Number)),last=Number(s.game?.lastBall),board=$('board');board.className=`board m${mode}`;board.innerHTML=Array.from({length:total},(_,i)=>{const n=i+1;return`<span class="num ${set.has(n)?'hit':''} ${n===last?'last':''}">${n}</span>`}).join('')}
function miniCard(item,set,index){const card=item.card||{},mode=Number(card.mode)===75?75:90,cells=(card.grid||[]).flat().map(value=>Number.isFinite(value)?`<i class="${set.has(value)?'hit':''}">${value}</i>`:'<i class="blank">·</i>').join(''),missing=item.score===0?'LISTO':`FALTA${item.score===1?'':'N'} ${item.score}`;return`<article class="card ${index===0?'leader':''}"><div class="cardHead"><b>${esc(item.name||'Jugador')}</b><span>#${String(card.globalNumber||'').padStart(3,'0')}</span></div><div class="mini m${mode}">${cells}</div><div class="missing">${missing}</div></article>`}
function renderCards(s){const info=nearest(s.game?.drawn||[]);$('target').textContent=info.target;$('potMeta').textContent=`AHORA: ${info.target}`;const html=info.ranked.map((item,index)=>miniCard(item,info.set,index));while(html.length<6)html.push('<article class="card emptyCard">—</article>');$('cards').innerHTML=html.join('')}
function renderRecent(s){const mode=Number(s.game?.mode)===75?75:90,items=(s.game?.drawn||[]).slice(-5).reverse().map(n=>`<span class="recentBall">${mode===75?`${bingoLetter(n)} ${n}`:n}</span>`);while(items.length<5)items.push('<span class="recentBall empty">—</span>');$('recent').innerHTML=items.join('')}
function statusText(status){return status==='playing'?'● EN VIVO':status==='paused'?'● PAUSADO':status==='waiting'?'● PREPARANDO':status==='finished'?'● FINALIZADO':'● EN VIVO'}
function marqueeValue(){return localStorage.getItem(TOP_TEXT_KEY)||payload.topText||payload.title||state?.roomSettings?.eventTitle||'EVENTO EN VIVO'}
function renderMarquee(){const el=$('marqueeText'),text=marqueeValue();el.textContent=text;el.classList.toggle('scroll',text.length>55)}
function renderScene(s){const raw=String(s?.eventDesign?.scene||'game'),scene=s.status==='waiting'&&raw==='game'?'waiting':s.status==='finished'&&raw==='game'?'final':raw,host=$('scene');if(scene==='game'){host.classList.remove('show');return}const labels={waiting:['PRÓXIMAMENTE','COMENZAMOS EN BREVE',payload.title||s.roomSettings?.eventTitle||'EVENTO'],pause:['PAUSA','PAUSA DEL EVENTO','Volvemos en unos instantes'],line:['PREMIO','¡LÍNEA!','Premio confirmado'],bingo:['PREMIO MAYOR','¡BINGO!','Premio confirmado'],final:['FINAL','GRACIAS POR PARTICIPAR',payload.title||s.roomSettings?.eventTitle||'EVENTO']},[k,t,sub]=labels[scene]||labels.pause;$('sceneKicker').textContent=k;$('sceneTitle').textContent=t;$('sceneText').textContent=sub;const logo=s?.eventDesign?.assets?.logo;if(logo?.hasAsset&&logo.url){$('sceneLogo').src=logo.url;$('sceneLogo').classList.remove('hidden')}else $('sceneLogo').classList.add('hidden');host.classList.add('show')}
function render(s){state=s;lastStateAt=Date.now();refreshAssignments();if(!s?.active)return fail('La sala no está activa.');$('app').classList.remove('hidden');$('error').classList.add('hidden');const mode=Number(s.game?.mode)===75?75:90,drawn=s.game?.drawn||[],last=s.game?.lastBall,title=payload.title||s.roomSettings?.eventTitle||'EVENTO';$('eventTitle').textContent=title;$('eventMeta').textContent=`Bingo ${mode} · ${drawn.length} bolillas`;$('status').textContent=statusText(s.status);$('sync').textContent='SINCRONIZADO';$('ball').innerHTML=ballMarkup(last,mode);$('count').textContent=`Bolilla ${drawn.length} de ${mode}`;const logo=s.eventDesign?.assets?.logo;$('logo').src=logo?.hasAsset&&logo.url?logo.url:'/assets/logo.webp';renderMarquee();renderRecent(s);renderBoard(s);renderCards(s);renderSponsors();renderScene(s)}
function fail(message){$('error').textContent=message;$('error').classList.remove('hidden')}
function serverSponsors(){return(state?.eventSponsors||[]).filter(item=>item?.imageUrl).map(item=>({id:`server-${item.slot}`,enabled:true,label:item.label||'',image:item.imageUrl}))}
async function loadSponsors(){const local=await dbGet(SPONSOR_KEY);sponsorList=Array.isArray(local)&&local.some(item=>item?.image)?local.filter(item=>item.enabled!==false&&item.image):serverSponsors();renderSponsors(false)}
function renderSponsors(force=false){const host=$('sponsors');if(!host)return;const list=sponsorList.filter(item=>item.enabled!==false&&item.image),sig=JSON.stringify(list.map(item=>[item.id,item.label,item.image]));if(!list.length){host.innerHTML='<div class="sponsorTitle">SPONSORS</div><div class="sponsorEmpty">ESPACIO PARA SPONSORS</div>';clearInterval(sponsorTimer);sponsorTimer=null;sponsorSig='';return}if(force||sig!==sponsorSig){sponsorSig=sig;sponsorIndex=0;clearInterval(sponsorTimer);sponsorTimer=null;if(list.length>1)sponsorTimer=setInterval(()=>{sponsorIndex=(sponsorIndex+1)%Math.max(1,sponsorList.filter(item=>item.enabled!==false&&item.image).length);paintSponsor()},10000)}paintSponsor()}
function paintSponsor(){const host=$('sponsors'),list=sponsorList.filter(item=>item.enabled!==false&&item.image);if(!host||!list.length)return;sponsorIndex=((sponsorIndex%list.length)+list.length)%list.length;const item=list[sponsorIndex];host.innerHTML=`<div class="sponsorTitle">SPONSORS</div><img src="${esc(item.image)}" alt="${esc(item.label||'Sponsor')}">${item.label?`<div class="sponsorName">${esc(item.label)}</div>`:''}<div class="dots">${list.length>1?list.map((_,i)=>`<i class="${i===sponsorIndex?'on':''}"></i>`).join(''):''}</div>`}
async function refresh(){if(!payload.alias)throw new Error('Falta el código de transmisión.');const response=await fetch(`/api/broadcast/state?token=${encodeURIComponent(payload.alias)}`,{cache:'no-store'}),data=await response.json();if(!response.ok)throw new Error(data.error||'Transmisión no válida.');render(data)}
function connect(){const es=new EventSource(`/api/events?role=broadcast&broadcastToken=${encodeURIComponent(payload.alias)}`);es.addEventListener('state',event=>{try{render(JSON.parse(event.data))}catch{}});es.onerror=()=>{$('sync').textContent='RECONECTANDO…';setTimeout(()=>refresh().catch(()=>{}),1200)}}
assignments=payload.assignments&&typeof payload.assignments==='object'?payload.assignments:{};
Promise.all([loadLot(),loadSponsors()]).then(()=>refresh()).then(connect).catch(error=>fail(error.message));
setInterval(()=>{if(state&&Date.now()-lastStateAt>7000)refresh().catch(()=>{$('sync').textContent='RECONECTANDO…'})},4500);setInterval(loadSponsors,4000);
window.addEventListener('storage',event=>{if(event.key===TOP_TEXT_KEY)renderMarquee()});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){loadSponsors();refresh().catch(()=>{})}});
})();
</script>
</body>
</html>
