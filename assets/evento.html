<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Abriendo Modo Evento…</title><style>body{margin:0;background:#09060d;color:#fff;font-family:system-ui;display:grid;place-items:center;min-height:100vh;text-align:center}small{color:#bcaec2}</style></head><body><div><b>ABRIENDO MODO EVENTO LAB…</b><br><small>Preparando el panel.</small></div><script>(async()=>{const token=sessionStorage.getItem('bingoOnlineAdminToken:owner')||'';if(token){try{const h={'X-Admin-Token':token};const r=await fetch('/api/admin/community',{headers:h});if(r.ok){const d=await r.json(),e=d.event;if(e?.workspaceId){await fetch('/api/admin/workspace/select',{method:'POST',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify({workspaceId:e.workspaceId})})}}}catch{}}location.replace('/assets/evento-lab.html')})()</script></body></html>
