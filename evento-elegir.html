<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4A121B"><title>Elegir cartón · Evento Premium</title><style>:root{--wine:#6E1F2A;--deep:#2B0D12;--gold:#C8A96B;--cream:#FFF8F2;--ink:#261317}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#6e1f2a,#2b0d12 55%,#120609);font-family:Segoe UI,Arial,sans-serif;color:#fff;min-height:100vh}button{font:inherit}.wrap{width:min(1180px,100%);margin:auto;padding:16px}.head{display:flex;gap:12px;align-items:center;background:#220b10dd;border:1px solid #ffffff22;border-radius:20px;padding:14px;position:sticky;top:10px;z-index:5;backdrop-filter:blur(10px)}.head img{width:64px;height:64px;object-fit:contain;border-radius:12px;background:#fff}.head h1{font-size:21px;margin:0}.muted{color:#e2cbd0;font-size:13px}.status{margin:12px 0;padding:12px;border:1px solid #ffffff20;background:#210c12;border-radius:14px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.card{background:var(--cream);color:var(--ink);border:3px solid transparent;border-radius:16px;padding:10px;box-shadow:0 10px 28px #0005;cursor:pointer}.card.selected{border-color:var(--gold);box-shadow:0 0 0 3px #c8a96b55,0 10px 28px #0007}.card h3{margin:0 0 7px;color:var(--wine)}.grid90{display:grid;grid-template-columns:repeat(9,1fr)}.grid75{display:grid;grid-template-columns:repeat(5,1fr)}.cell{aspect-ratio:1;display:grid;place-items:center;border:1px solid #ded2d2;font-size:11px;font-weight:900;background:#fff}.blank{background:#eee7e7;color:transparent}.free{background:#f4e9c8;color:#7a5a17}.actions{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:8px}.btn{border:0;border-radius:11px;padding:9px 11px;font-weight:900;cursor:pointer}.reserve{background:var(--wine);color:#fff}.release{background:#ede4e2;color:#6e1f2a}.done{background:#153d2b;color:#dcffea;padding:12px;border-radius:12px;margin:10px 0}.err{background:#5c1c2a;color:#ffdbe3;padding:12px;border-radius:12px;margin:10px 0}.search{width:100%;margin:12px 0;padding:12px;border-radius:12px;border:1px solid #ffffff33;background:#19090d;color:#fff;font-size:16px}@media(max-width:850px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:470px){.cards{grid-template-columns:1fr}.head{position:static}.cell{font-size:13px}}</style></head><body><div class="wrap"><header class="head"><img id="logo" src="/assets/logo.webp"><div><h1 id="name">Elegí tu cartón</h1><div id="details" class="muted">Cargando Evento…</div></div></header><div id="message"></div><div id="summary" class="status"></div><input id="search" class="search" placeholder="Buscar número de cartón"><main id="cards" class="cards"></main></div><script src="/js/evento-elegir.js?v=phase5-4-20260822"></script></body></html>
