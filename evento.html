<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modo Evento · El Bingo de la Gorda</title><style>body{margin:0;background:#09070f;color:#fff;font-family:Segoe UI,Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.box{width:min(520px,92vw);background:#171020;border:1px solid #ffffff20;border-radius:20px;padding:22px;text-align:center}.box img{width:100px}.box input{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid #ffffff30;background:#0c0911;color:#fff;text-align:center;font-size:22px;font-weight:900;letter-spacing:.08em}.box button{margin-top:10px;width:100%;padding:14px;border:0;border-radius:12px;background:#f2c441;font-weight:1000}.msg{margin-top:14px;color:#c8becf;line-height:1.45}.ok{color:#b9ffd8}.err{color:#ffb5c2}</style></head><body><main class="box"><img src="/assets/logo.webp"><h1>MODO EVENTO</h1><p>Ingresá el código privado de tu cartón.</p><input id="code" maxlength="9" placeholder="ABCD-EFGH"><button id="go">VERIFICAR CÓDIGO</button><div id="msg" class="msg">Fase 1 reconoce la tanda y el cartón. La vinculación con jugadores y la vista de todos sus cartones se habilita en Fase 2.</div></main><script>const q=new URLSearchParams(location.search);const input=document.getElementById('code'),msg=document.getElementById('msg');input.value=(q.get('codigo')||'').toUpperCase();input.oninput=()=>{let v=input.value.toUpperCase().replace(/[^23456789ABCDEFGHJKLMNPQRSTUVWXYZ]/g,'').slice(0,8);input.value=v.length>4?v.slice(0,4)+'-'+v.slice(4):v};async function go(){const r=await fetch('/api/event/access-info?codigo='+encodeURIComponent(input.value));const d=await r.json().catch(()=>({}));msg.className='msg '+(r.ok?'ok':'err');msg.textContent=r.ok?`${d.event?.name||'Evento'} · Cartón ${String(d.cardNumber||'').padStart(4,'0')}. ${d.message||''}`:(d.error||'No se pudo verificar el código.')}document.getElementById('go').onclick=go;if(input.value)go();</script></body></html>
