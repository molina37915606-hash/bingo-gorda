</style></head><body><div class="shell"><section id="accessScreen" class="access"><img src="/assets/logo.webp" alt="El Bingo de la Gorda"><h1>MODO EVENTO</h1><p>Ingresá el código privado de cualquiera de tus cartones.</p><input id="code" maxlength="9" placeholder="ABCD-EFGH" autocomplete="one-time-code"><button id="go" class="btn primary">ENTRAR A MIS CARTONES</button><div id="msg" class="msg">Un código abre automáticamente todos los cartones vinculados a tu nombre.</div></section>
