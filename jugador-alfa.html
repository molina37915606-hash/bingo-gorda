<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070914">
<title>Bingo de la Gorda ALFA · Jugador</title>
<style>
:root{--bg:#060914;--panel:#11182b;--panel2:#18223a;--panel3:#0b1020;--text:#f8f9ff;--muted:#aeb9cf;--line:#ffffff22;--gold:#ffca2f;--gold2:#ffe370;--green:#29c381;--red:#ef5871;--purple:#8c45cf;--cell:#f5f6f8;--cellText:#111827;--marked:#ffd84f;--drawn:#cfe8ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#251c4b,var(--bg) 48%,#02040a);color:var(--text);font-family:Segoe UI,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{width:min(1050px,100%);margin:auto;padding:8px 8px 90px}.top{display:flex;align-items:center;gap:9px;position:sticky;top:0;z-index:30;padding:8px 10px;border:1px solid var(--line);border-radius:14px;background:#11182bef;backdrop-filter:blur(12px);box-shadow:0 8px 26px #0007}.top img{width:42px;height:42px;object-fit:contain}.brand{min-width:0}.brand b{display:block;font-size:14px}.brand small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.net{margin-left:auto;padding:6px 8px;border-radius:999px;background:#173e32;color:#c7ffe8;border:1px solid #2c9168;font-size:10px;font-weight:1000}.net.off{background:#4c1721;border-color:#a63549;color:#ffd7de}.panel{margin-top:8px;padding:12px;border:1px solid var(--line);border-radius:16px;background:#11182be8;box-shadow:0 14px 34px #0005}.stateHero{text-align:center;padding:26px 14px}.stateHero img{width:82px;height:82px;object-fit:contain}.stateHero h1{font-size:24px;margin:10px 0 6px}.stateHero p{color:var(--muted);line-height:1.45;margin:0 auto;max-width:620px}.spinner{width:42px;height:42px;margin:20px auto;border:4px solid #ffffff22;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:1000}.primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#241700}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.danger{background:#7c2435;color:#fff}.actions{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:14px}.statusCards{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.stat{padding:9px;border:1px solid var(--line);border-radius:11px;background:var(--panel3);text-align:center}.stat b{display:block;font-size:16px}.stat small{color:var(--muted);font-size:9px}.notice{padding:11px;border-radius:11px;background:#163a30;border:1px solid #2f8b69;color:#dbfff2;line-height:1.4}.warning{background:#49390e;border-color:#9b7720;color:#fff0b0}.error{background:#4c1721;border-color:#a63549;color:#ffd7de}.offerTop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px}.offerTop h2{font-size:18px;margin:0}.counter{padding:7px 9px;border-radius:999px;background:#2a2042;color:#f0ddff;font-size:11px;font-weight:1000}.offers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.offer{border:2px solid var(--line);border-radius:12px;background:var(--panel2);padding:8px;color:var(--text);text-align:left}.offer.selected{border-color:var(--gold);box-shadow:0 0 0 3px #ffca2f22}.offer header{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}.offer header b{font-size:12px}.miniGrid{display:grid;gap:2px}.miniGrid.m90{grid-template-columns:repeat(9,1fr)}.miniGrid.m75{grid-template-columns:repeat(5,1fr)}.miniCell{display:grid;place-items:center;min-height:20px;background:#f5f5f7;color:#151923;border-radius:3px;font-size:8px;font-weight:1000}.miniCell.blank{background:#292f42;color:transparent}.miniCell.free{background:#7e45c2;color:#fff;font-size:6px}.chosenList{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}.chosen{padding:7px 10px;border-radius:999px;background:#2b2142;border:1px solid #704ba2;color:#f6eaff;font-size:11px;font-weight:900}.modeRow{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.modeBtn{border:2px solid var(--line);border-radius:11px;padding:10px;background:var(--panel3);color:var(--muted);font-weight:1000}.modeBtn.active{background:var(--gold);color:#241700;border-color:var(--gold)}.gameLayout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:8px}.ballPanel{text-align:center}.ball{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:4px auto;background:radial-gradient(circle at 35% 28%,#fff,#e9d5ff 20%,#a350ef 48%,#4a1677 78%);border:7px solid #ffffff28;box-shadow:0 0 35px #9e4cff55;color:#1d082d;font-size:62px;font-weight:1000}.ball small{display:block;font-size:18px}.gameStatus{font-weight:1000;font-size:16px}.gameStatusSub{color:var(--muted);font-size:11px;margin-top:3px}.recent{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-top:8px}.recent span{display:grid;place-items:center;min-width:34px;height:32px;padding:0 7px;border-radius:999px;background:var(--panel2);font-size:11px;font-weight:1000}.ticketPanel{margin-top:8px}.tabs{display:flex;gap:5px;overflow:auto;padding-bottom:6px}.tabs button{white-space:nowrap;border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:var(--panel2);color:var(--text);font-size:10px;font-weight:900}.tabs button.active{background:var(--purple)}.ticketHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 7px}.ticketHead b{font-size:15px}.ticketHead small{font-size:10px;color:var(--muted)}.ticket{display:grid;gap:3px}.ticket.m90{grid-template-columns:repeat(9,minmax(0,1fr))}.ticket.m75{grid-template-columns:repeat(5,minmax(0,1fr))}.cell{border:0;aspect-ratio:1.03;min-height:42px;border-radius:6px;background:var(--cell);color:var(--cellText);display:grid;place-items:center;font-weight:1000;font-size:clamp(15px,4.5vw,28px);position:relative}.m90 .cell{font-size:clamp(12px,3.6vw,23px)}button.cell:not(.marked):active{transform:scale(.96)}.cell.blank{background:#272d3e;color:transparent}.cell.free{background:var(--purple);color:#fff;font-size:10px}.cell.drawn:not(.marked){box-shadow:inset 0 0 0 2px #5cb5ff;background:var(--drawn)}.cell.marked{background:var(--marked);color:#251800;box-shadow:inset 0 0 0 2px #e6a900}.cell.marked:after{content:'✓';position:absolute;right:3px;top:1px;font-size:9px}.cell:disabled{cursor:default}.claims{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:8px}.claimBtn{border:1px solid #7449a0;border-radius:11px;padding:10px 5px;background:#3a2452;color:#fff;font-size:11px;font-weight:1000}.claimBtn.ready{background:linear-gradient(135deg,#ffb51e,#ffe36b);color:#251700;border-color:#ffd44c;box-shadow:0 0 0 3px #ffd44c22,0 0 20px #ffcf3b44}.claimBtn:disabled{opacity:.45;cursor:default}.sideInfo{display:grid;gap:8px}.sideInfo h3{font-size:12px;margin:0 0 6px}.numbersGrid{display:flex;flex-wrap:wrap;gap:4px;max-height:225px;overflow:auto}.numbersGrid span{display:grid;place-items:center;width:30px;height:30px;border-radius:7px;background:var(--panel2);font-size:10px;font-weight:1000}.claimHistory{display:grid;gap:5px}.claimHistory div{padding:7px;border-radius:8px;background:var(--panel2);font-size:10px}.chatFab{position:fixed;right:12px;bottom:12px;z-index:80;width:54px;height:54px;border:1px solid #ffffff33;border-radius:50%;background:#7c39bd;color:#fff;font-size:22px;box-shadow:0 10px 30px #0009}.chatCount{position:absolute;right:-2px;top:-3px;min-width:20px;height:20px;padding:0 4px;border-radius:999px;background:#e53855;color:#fff;display:grid;place-items:center;font-size:10px;font-weight:1000}.chatPanel{position:fixed;right:10px;bottom:10px;z-index:90;width:min(760px,calc(100vw - 20px));height:min(78dvh,720px);border:1px solid var(--line);border-radius:16px;background:#10172af7;box-shadow:0 18px 60px #000b;display:grid;grid-template-rows:auto 1fr auto auto;overflow:hidden}.chatHead{display:flex;justify-content:space-between;align-items:center;padding:9px 11px;border-bottom:1px solid var(--line);background:#171f35}.chatHead b{font-size:13px}.minChat{border:1px solid var(--line);border-radius:8px;background:var(--panel3);color:#fff;padding:6px 9px;font-weight:1000}.chatMessages{overflow:auto;padding:7px;display:grid;align-content:start;gap:4px}.msg{padding:6px 8px;border-radius:9px;background:var(--panel2);font-size:11px;line-height:1.28}.msg.admin{border:1px solid #c89926}.msg b{color:var(--gold)}.msg .premiumSticker{--sticker-size:72px}.emojiRow{display:flex;gap:4px;overflow:auto;padding:5px 7px;border-top:1px solid var(--line)}.emojiRow button{border:0;border-radius:7px;background:var(--panel2);color:#fff;padding:5px 7px}.chatComposer{display:grid;grid-template-columns:1fr auto;gap:5px;padding:7px;border-top:1px solid var(--line)}.chatComposer input{min-width:0;border:1px solid var(--line);border-radius:9px;background:var(--panel3);color:#fff;padding:9px}.chatComposer button{border:0;border-radius:9px;background:var(--gold);color:#251700;font-weight:1000;padding:8px 11px}.toast{position:fixed;left:50%;bottom:78px;z-index:150;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;max-width:min(90vw,620px);padding:10px 13px;border-radius:10px;background:#101729f5;border:1px solid var(--line);box-shadow:0 10px 35px #000a;font-size:12px;font-weight:900;transition:.18s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:720px){.app{padding:6px 6px 78px}.top{padding:7px}.top img{width:36px;height:36px}.gameLayout{grid-template-columns:1fr}.sideInfo{display:none}.offers{grid-template-columns:1fr}.statusCards{grid-template-columns:repeat(3,1fr)}.ball{width:118px;height:118px;font-size:48px}.panel{padding:9px}.cell{min-height:35px;border-radius:4px}.claims{grid-template-columns:repeat(2,1fr)}.chatPanel{left:7px;right:7px;bottom:7px;width:auto;height:min(48dvh,430px);border-radius:14px}.chatMessages{gap:3px;padding:5px}.msg{padding:4px 6px;font-size:10px;line-height:1.2}.chatHead{padding:7px 9px}.emojiRow{padding:4px 5px}.chatComposer{padding:5px}.chatFab{width:50px;height:50px}.stateHero{padding:20px 10px}.stateHero h1{font-size:21px}}
@media(orientation:landscape) and (max-height:580px){.app{padding-bottom:60px}.gameLayout{grid-template-columns:220px 1fr}.sideInfo{display:none}.ball{width:96px;height:96px;font-size:40px}.ticketPanel{margin-top:0}.cell{min-height:30px;aspect-ratio:auto;height:clamp(28px,8vh,42px)}.chatPanel{height:min(66dvh,360px);width:min(620px,calc(100vw - 14px))}}
</style>
</head>
<body>
<main class="app">
  <header class="top"><img src="/assets/logo.png" alt=""><div class="brand"><b>BINGO DE LA GORDA ALFA</b><small id="playerMeta">Abriendo tu sesión privada…</small></div><span id="networkPill" class="net">CONECTANDO</span></header>
  <section id="root" class="panel"><div class="stateHero"><img src="/assets/logo.png" alt=""><div class="spinner"></div><h1>Cargando sala…</h1><p>Estamos recuperando tu sesión privada. No cierres la página.</p></div></section>
</main>
<button id="chatFab" class="chatFab hidden" type="button" aria-label="Abrir chat">💬<span id="chatCount" class="chatCount hidden">0</span></button>
<section id="chatPanel" class="chatPanel hidden" aria-label="Chat de la sala">
  <header class="chatHead"><b>CHAT DE LA SALA</b><button id="minChat" class="minChat" type="button">— MINIMIZAR</button></header>
  <div id="chatMessages" class="chatMessages"></div>
  <div id="emojiRow" class="emojiRow"></div>
  <form id="chatForm" class="chatComposer"><input id="chatInput" maxlength="160" placeholder="Escribí un mensaje…" autocomplete="off"><button type="submit">ENVIAR</button></form>
</section>
<div id="toast" class="toast"></div>
<script src="/js/emoji-stickers.js?v=2.0.0"></script>
<script src="/js/player-alfa.js?v=6.0.0"></script>
</body>
</html>
