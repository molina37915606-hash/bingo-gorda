# BINGO DE LA GORDA - Final
# Configuración orientada al Web Service Starter actual. La persistencia requiere un disco montado por separado.
services:
  - type: web
    name: bingo-gorda-alfa
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ONLINE_MODE
        value: "true"
      - key: MASTER_ADMIN_PASSWORD
        sync: false
      - key: BINGO_TIMEZONE
        value: America/Argentina/Buenos_Aires
      - key: BINGO_CLAIM_AUTO_VERIFY_MS
        value: "10000"
