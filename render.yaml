# BINGO DE LA GORDA ALFA
# Configuración orientada a pruebas. El plan free puede tener disco efímero.
services:
  - type: web
    name: bingo-gorda-alfa
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ONLINE_MODE
        value: "true"
      - key: MASTER_ADMIN_PASSWORD
        sync: false
      - key: BINGO_TIMEZONE
        value: America/Argentina/Buenos_Aires
      - key: BINGO_CLAIM_AUTO_VERIFY_MS
        value: "10000"
